<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
            }

            * {
                box-sizing: border-box;
                margin: 0px;
                padding: 0px;
            }

            .container {
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .inputs {
                border: 1px solid black;
                border-radius: 3rem;
                display: flex;
            }

            .inputs > input {
                width: 70%;
                height: 100px;
                border: none;
                outline: none;
                padding: 2rem 3rem;
                border-radius: 3rem 0px 0px 3rem;
                font-size: 1rem;
            }

            .inputs > button {
                height: 100px;
                outline: none;
                border: none;
                padding: 2rem 3rem;
                border-radius: 0rem 3rem 3rem 0rem;
                font-size: 2rem;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="inputs">
                <input id="input" type="password" />
                <button id="toggle">
                    <svg
                        width="1em"
                        height="1em"
                        viewBox="0 0 16 16"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        stroke-width="1.33333"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke="currentColor"
                        aria-hidden="true"
                    >
                        <path
                            d="M1.33331 7.99998C1.33331 7.99998 3.73331 3.33331 7.99998 3.33331C12.2666 3.33331 14.6666 7.99998 14.6666 7.99998C14.6666 7.99998 12.2666 12.6666 7.99998 12.6666C3.73331 12.6666 1.33331 7.99998 1.33331 7.99998Z"
                        />
                        <path
                            d="M10 8C10 9.10457 9.10457 10 8 10C6.89543 10 6 9.10457 6 8C6 6.89543 6.89543 6 8 6C9.10457 6 10 6.89543 10 8Z"
                        />
                    </svg>
                </button>
            </div>
        </div>
        <script>
            const input = document.querySelector("#input");
            const button = document.querySelector("#toggle");

            button.onclick = ()=>{
                if(input.type == "password"){
                    input.type = "text";
                    return;
                }
                if(input.type == "text"){
                    input.type = "password";
                    return;
                }
            }

        </script>
    </body>
</html>
